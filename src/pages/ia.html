<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">

<title>Neural-iA</title>

<link rel="stylesheet" href="../css/chat.css">

</head>

<body>

<header class="topbar">

    <button id="backButton" type="button" aria-label="Voltar">
        ☰
    </button>

    <h1>Neural-iA</h1>

    <button id="newChat" type="button" aria-label="Nova conversa">
        ＋
    </button>

</header>

<main id="chat-messages" aria-live="polite" aria-label="Conversa com Neural-iA">

    <div class="welcome">

        <h2>Olá 👋</h2>

        <p>Como posso ajudar você hoje?</p>

    </div>

</main>

<footer class="composer">

    <textarea
        id="chat-input"
        placeholder="Pergunte qualquer coisa..."
        rows="1"
        aria-label="Mensagem para o Neural-iA"></textarea>

    <button id="send-button" type="button">
        Enviar
    </button>

</footer>

<script src="../js/chat.js"></script>

</body>

</html>
